name: ecs build
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: sonar scan
        uses: sonarsource/sonarqube-scan-action@v2
        with:
          projectBaseDir: ./src
          args: >
            -Dsonar.projectKey=Gaurav2327_terraform-aws-ecs-deployment
            -Dsonar.projectName=terraform-aws-ecs-deployment
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: sonar quality gates
        uses: sonarsource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: src/.scannerwork/report-task.txt
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: setup docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build image
        run: docker build -t ecr-image:${{ github.sha }} .
      - name: scan image
        uses: aquasecurity/trivy-action@0.25.0
        with:
          format: 'table'
          image-ref: ecr-image:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
      - name: AWS configuration
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 #ecr public is available only in us-east-1 region
      - name: login aws ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      - name: push image to ecr
        if: github.ref == 'refs/heads/main'
        run: |
          PUBLIC_REGISTRY="public.ecr.aws/${{ secrets.ECR_ALIAS }}"
          IMAGE_NAME="ecr-image"
          TAG="${{ github.sha }}"
          docker tag $IMAGE_NAME:$TAG $PUBLIC_REGISTRY/$IMAGE_NAME:$TAG
          docker push $PUBLIC_REGISTRY/$IMAGE_NAME:$TAG
      - name: image url
        run: echo "Image pushed to - public.ecr.aws/${{ secrets.ECR_ALIAS }}/ecr-image:${{ github.sha }}"
